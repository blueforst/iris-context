name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # R1-P1d (fork file: adoption): iris_agent consumes the adjacent
      # blueforst/pi checkout (production lock seamCommit). Build Pi first so
      # the file: deps resolve to built packages.
      - uses: actions/checkout@v4
        with:
          repository: blueforst/pi
          path: ../pi
          ref: b7c5f40c3040f179fe644e0ffad1970a14563b15
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install Pi fork workspace
        run: npm ci
        working-directory: ../pi
      - name: Build Pi fork packages (ai/agent/sqlite-node)
        run: npm run build
        working-directory: ../pi
      - run: npm ci
      # Single aggregate check (format/lint/typecheck/unit + subprocess +
      # migration/crash/build/CLI/dist smoke) so CI never drifts from the
      # repository's own check contract — including the subprocess suite that
      # exercises the real long-lived Host.
      - run: npm run check
